spring.datasource.url=jdbc:mysql://127.0.0.1:3306/alertme_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically generate database tables based on Models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Multipart file upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Firebase Admin configuration
alertme.firebase.config-path=alertme-b1834-firebase-adminsdk-fbsvc-e704d65659.json

# Server port
server.port=8080

# Diagnostic logging — helps trace auth/CORS issues
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.com.alertme=DEBUG
